name: Обновление статистики

on:
  schedule:
    # время в UTC, Москва = UTC+3
    - cron: "0 21 * * 0-4"    # будни: каждую ночь в 00:00 МСК
    - cron: "0 21-23 * * 5"   # ночь с пятницы на субботу, каждый час
    - cron: "0 * * * 6"       # суббота целиком, каждый час
    - cron: "0 0-20 * * 0"    # воскресенье до полуночи, каждый час
  workflow_dispatch:          # кнопка «запустить сейчас» во вкладке Actions
  push:
    branches: [main]
    paths: ["src/**", "build/**", "!src/data.js", "!src/photos-data.js"]

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Собрать страницу со свежими данными
        run: node build/build.mjs

      - name: Закоммитить, если что-то изменилось
        run: |
          if [ -z "$(git status --porcelain index.html src/data.js photos.html src/photos-data.js)" ]; then
            echo "Изменений нет — коммит не нужен"
            exit 0
          fi
          git config user.name "ice-hooligans-bot"
          git config user.email "actions@github.com"
          git add index.html src/data.js photos.html src/photos-data.js
          git commit -m "Статистика на $(date -u -d '+3 hours' '+%d.%m.%Y')"
          git pull --rebase --autostash
          git push
