<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="https://fs.mtgame.ru/1200x1200HCHooligans.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090c; --bg2:#0e1015; --card:#13161d; --line:#22262f;
  --txt:#eceef2; --dim:#8b93a3; --acc:#e11d2e; --acc2:#ff3b4e;
  --ok:#22c55e; --warn:#eab308; --bad:#ef4444;
  --mw:1240px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.num{font-family:Oswald,Impact,sans-serif;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0}
a{color:inherit}
.wrap{max-width:var(--mw);margin:0 auto;padding:0 20px}
section{padding:64px 0;border-top:1px solid var(--line)}
section>.wrap>h2{font-size:clamp(26px,4vw,40px);margin-bottom:6px}
.sub{color:var(--dim);margin-bottom:26px;font-size:14px}

/* header */
header{position:sticky;top:0;z-index:40;background:rgba(8,9,12,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:62px}
.nav img{height:38px;width:38px;object-fit:contain}
.nav b{font-family:Oswald;font-size:19px;letter-spacing:.06em;white-space:nowrap}
.nav nav{margin-left:auto;display:flex;gap:20px;overflow-x:auto}
.nav nav a{color:var(--dim);text-decoration:none;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.nav nav a:hover{color:var(--acc2)}

/* hero */
.hero{position:relative;overflow:hidden;border-top:0;padding:0}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:center;padding:70px 0 60px}
.hero h1{font-size:clamp(38px,7vw,86px);line-height:.95}
.hero h1 span{color:var(--acc)}
.hero p.lead{color:var(--dim);font-size:18px;max-width:56ch;margin:18px 0 26px}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:13px;color:var(--dim)}
.badge b{color:var(--txt)}
.hero-logo{filter:drop-shadow(0 20px 60px rgba(225,29,46,.35));width:100%}
.glow{position:absolute;inset:auto -10% 30% 40%;height:420px;background:radial-gradient(circle,rgba(225,29,46,.22),transparent 65%);pointer-events:none}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:34px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tile .v{font-family:Oswald;font-size:32px;line-height:1}
.tile .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.tile.acc .v{color:var(--acc2)}

/* generic cards/tables */
.grid{display:grid;gap:14px}
.cards3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;min-width:0}
/* season card */
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.shead h3{font-size:24px;line-height:1}
.sdiv{color:var(--dim);font-size:13px;margin:6px 0 14px}
.sstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sstats .si{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 6px;min-width:0;text-align:center}
.sstats .v{font-family:Oswald,Impact,sans-serif;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sstats .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;white-space:nowrap}
.snote{color:var(--dim);font-size:13px;margin:14px 0 0;padding-top:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);max-width:100%}
.grid>*{min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
thead th{background:#171b23;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;z-index:1}
thead th:hover{color:var(--txt)}
tbody tr:hover{background:#1a1f28}
tbody tr:last-child td{border-bottom:0}
tr.me td{background:rgba(225,29,46,.10);font-weight:700}
.mono{font-variant-numeric:tabular-nums}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--bg2);color:var(--dim);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* games */
.game{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.game:last-child{border-bottom:0}
.game .d{color:var(--dim);font-size:12px}
.game .opp{font-weight:600}
.game .meta{color:var(--dim);font-size:12px}
.score{font-family:Oswald;font-size:20px;min-width:74px;text-align:right}
.W{color:var(--ok)} .L{color:var(--bad)} .D{color:var(--warn)}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--dim);margin-left:8px;vertical-align:middle}
.pill.po{border-color:var(--acc);color:var(--acc2)}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center;text-decoration:none;display:block;transition:.15s}
.pcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.pcard .ph{aspect-ratio:1/1;background:#1b1f27 center/cover no-repeat;position:relative}
.pcard .no{position:absolute;left:8px;top:8px;background:var(--acc);color:#fff;font-family:Oswald;font-size:15px;padding:2px 8px;border-radius:8px}
.pcard .c{position:absolute;right:8px;top:8px;background:#fff;color:#000;font-family:Oswald;font-size:13px;width:24px;height:24px;line-height:24px;border-radius:50%}
.pcard .nm{padding:10px 8px 4px;font-weight:600;font-size:14px}
.pcard .ps{padding:0 8px 8px;color:var(--dim);font-size:12px}

/* achievements */
.ach{display:inline-flex;gap:3px;align-items:center;margin-left:7px;vertical-align:-5px}
.ach img{width:20px;height:20px;display:block}
.ach.big{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin:0 0 12px;padding:0 8px}
.ach.big img{width:26px;height:26px}

/* photos page */
.parch{display:grid;gap:12px}
.pgame{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pgame>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:12px 16px}
.pgame>summary::-webkit-details-marker{display:none}
.pgame>summary:hover{background:#1a1f28}
.pgame .pd{color:var(--dim);font-size:12px}
.pgame .pt{font-weight:600}
.pgame .pm{color:var(--dim);font-size:12px}
.pgame .pn{font-family:Oswald,Impact,sans-serif;font-size:15px;color:var(--acc2);white-space:nowrap}
.pgame[open]>summary{border-bottom:1px solid var(--line)}
.pstrip{display:flex;gap:6px}
.pstrip img{width:44px;height:32px;object-fit:cover;border-radius:5px;background:#1b1f27}
.pbody{padding:12px 16px 16px}
.ymenu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.mmenu{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.mtab{border:1px solid var(--line);background:var(--bg2);color:var(--dim);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.mtab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pcount{color:var(--dim);font-size:13px;margin:0 0 18px}
.pmore{display:inline-block;margin-top:18px;border:1px solid var(--acc);color:var(--acc2);border-radius:999px;padding:10px 22px;text-decoration:none;font-weight:600;font-size:14px}
.pmore:hover{background:var(--acc);color:#fff}
@media(max-width:700px){.pgame>summary{grid-template-columns:76px 1fr;gap:8px}.pstrip{display:none}}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.gal button{padding:0;border:0;background:#1b1f27;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:3/2}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.gal button:hover img{transform:scale(1.06)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px;padding:20px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:8px}
#lb .cap{color:var(--dim);font-size:14px}
#lb .x{position:absolute;top:16px;right:20px;font-size:30px;color:#fff;cursor:pointer;line-height:1}
#lb .arr{position:absolute;top:50%;font-size:44px;color:#fff;cursor:pointer;user-select:none;padding:10px}
#lb .arr.p{left:10px} #lb .arr.n{right:10px}

/* timeline */
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:22px;display:grid;gap:22px}
.tl .it{position:relative}
.tl .it:before{content:"";position:absolute;left:-30px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--acc)}
.tl h4{font-size:19px}
.tl .y{color:var(--acc2);font-size:13px;font-weight:700;letter-spacing:.1em}

footer{padding:40px 0 60px;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}
footer a{color:var(--acc2)}
@media(max-width:860px){
  .hero-in{grid-template-columns:1fr;padding:44px 0}
  .hero-logo{max-width:200px}
  .game{grid-template-columns:74px 1fr auto;gap:8px}
}
</style>
</head>
